name: Deploy Backend to GCP

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/linkpecas-backend

            echo "==> Sync código"
            git fetch origin
            git reset --hard origin/main

            echo "==> Parando containers"
            docker-compose down --remove-orphans

            echo "==> Build limpo"
            docker-compose build --no-cache

            echo "==> Subindo containers"
            docker-compose up -d

            echo "==> Aguardando API ficar pronta..."
            sleep 10

            echo "==> Sincronizando Meilisearch (indexação inicial)"
            docker-compose exec -T api python app/scripts/sync_meilisearch.py || echo "Aviso: sync Meilisearch falhou (não crítico)"

            echo "==> Recarregando Nginx"
            docker-compose exec -T nginx nginx -s reload || echo "Aviso: nginx reload falhou"

            echo "==> Deploy finalizado com sucesso!"
