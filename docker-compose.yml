services:
  api:
    container_name: linkpecas_api
    build: .
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    depends_on:
      - db
      - redis
      - meilisearch

  db:
    image: postgres:16
    container_name: linkpecas_db
    restart: always
    environment:
      POSTGRES_DB: linkpecas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: linkpecas_redis
    restart: always

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: linkpecas_meilisearch
    restart: always
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-sua_chave_mestra_super_secreta}
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  nginx:
    image: nginx:alpine
    container_name: linkpecas_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - api

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do
        certbot renew;
        sleep 12h & wait $${!};
      done"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:
  meilisearch_data: